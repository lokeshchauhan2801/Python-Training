{% extends "admin/base_site.html" %}
{% comment %}
Top-level /agent-builder/ page, rendered inside the Unfold admin shell.

The LEFT column is the Unfold admin sidebar (from base_site.html, left
untouched). The content area holds a single same-origin <iframe> hosting the
React Flow canvas built/vendored under agents/static/agents/canvas/index.html.

The canvas talks to the DRF api/v1/agents/ endpoints same-origin, authenticated
by the session cookie. Write requests need the CSRF token, so the page hands it
to the iframe via the src querystring (?csrf=<token>). The token is read inside
the iframe's own origin — this is the same origin, so no cross-origin leak.

The iframe is sized to fill the content column with the same "min-height:0 flex
chain" the chat page uses, so the canvas gets the full viewport height and the
document itself never scrolls (only the canvas pans/zooms internally).
{% endcomment %}
{% load static i18n %}

{% block extrahead %}{{ block.super }}
  <style>

    html:has(body.agentbuilder-fixed-viewport),
    body.agentbuilder-fixed-viewport {
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
    }


    body.agentbuilder-fixed-viewport {
      --ab-header-h: 56px;
    }
    body.agentbuilder-fixed-viewport #agent-builder-root {
      position: fixed;
      top: var(--ab-header-h);
      right: 0;
      bottom: 0;

      left: var(--ab-left, 0px);
      overflow: hidden;
      background: #0a0f1e;
      z-index: 1;
    }
    body.agentbuilder-fixed-viewport #agent-builder-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
</style>
{% endblock %}

{% block content %}
<div id="content-main">
  {% csrf_token %}
  {% comment %}
  Expose the CSRF token to the same-origin iframe via its src querystring so the
  canvas can set the X-CSRFToken header on its POST/PUT/PATCH/DELETE calls to the
  api/v1/agents/ endpoints. The token is url-escaped; the iframe reads it back
  from its own location.search.
  {% endcomment %}
  <div id="agent-builder-root">
    <iframe
      id="agent-builder-frame"
      title="LangGraph agent builder"
      src="{% static 'agents/canvas/index.html' %}?csrf={{ csrf_token|urlencode }}&company={{ active_company_id|urlencode }}&company_name={{ active_company_name|urlencode }}"
    ></iframe>
  </div>
  <script>

    (function () {
      var body = document.body;
      body.classList.add("agentbuilder-fixed-viewport");

      var root = document.getElementById("agent-builder-root");

      function px(n) { return (n > 0 ? n : 0) + "px"; }

      function measure() {


        var headerH = 56;
        var header =
          document.querySelector("#main > header") ||
          document.querySelector("#content header") ||
          document.querySelector("header");
        if (header) {
          var hr = header.getBoundingClientRect();

          if (hr.top < 8 && hr.height > 0 && hr.height < 160) headerH = hr.height;
        }


        var left = 0;
        var contentEl =
          document.getElementById("content") ||
          document.getElementById("main");
        if (contentEl) {
          var cr = contentEl.getBoundingClientRect();
          if (cr.left > 0 && cr.left < window.innerWidth) left = cr.left;
        }

        body.style.setProperty("--ab-header-h", px(headerH));
        body.style.setProperty("--ab-left", px(left));
      }

      measure();

      window.addEventListener("resize", measure);
      window.setTimeout(measure, 50);
      window.setTimeout(measure, 300);


      try {
        var mo = new MutationObserver(function () { measure(); });
        mo.observe(body, { attributes: true, attributeFilter: ["class", "style"] });
        var sidebar =
          document.querySelector("#nav-sidebar") ||
          document.querySelector("[data-sidebar]") ||
          document.querySelector("aside");
        if (sidebar) mo.observe(sidebar, { attributes: true, attributeFilter: ["class", "style"] });
      } catch (e) {  }
    })();
</script>
</div>
{% endblock %}
