<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LangGraph agent builder</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #0f1629;
        --panel-2: #121a30;
        --node: #141d35;
        --node-border: #2a3657;
        --text: #e6ebf5;
        --muted: #8a97b5;
        --accent: #7c5cff;
        --accent-2: #4f7cff;
        --start: #22c55e;
        --end: #ef4444;
        --step: #4f7cff;
        --edge: #3ddc97;
        --danger: #ef4444;
        --ok: #22c55e;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
      }
      #app { display: flex; flex-direction: column; height: 100%; min-height: 0; }

      /* Top workflow bar */
      #toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--node-border);
      }
      #toolbar .title { font-weight: 600; margin-right: auto; display: flex; align-items: center; gap: 8px; }
      #toolbar .title small { color: var(--muted); font-weight: 400; }
      .flow-kicker { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
      .flow-name { font-size: 15px; font-weight: 700; color: var(--text); }
      .flow-chip { font-size: 10px; padding: 2px 8px; border-radius: 999px; background: #2a2340; color: var(--muted); border: 1px solid var(--node-border); }
      .flow-chip.active { background: #11271c; color: #7ef0b0; border-color: var(--ok); }
      .btn {
        appearance: none;
        border: 1px solid var(--node-border);
        background: var(--panel-2);
        color: var(--text);
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        line-height: 1.2;
      }
      .btn:hover { border-color: var(--accent); }
      .btn.primary { background: var(--accent); border-color: var(--accent); }
      .btn.ok { background: var(--accent-2); border-color: var(--accent-2); }
      .btn.danger { color: #fff; background: transparent; border-color: var(--danger); }
      .btn.danger:hover { background: var(--danger); }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }

      #hint { padding: 6px 14px; color: var(--muted); font-size: 11px; border-bottom: 1px solid var(--node-border); background: var(--panel); }

      #body { display: flex; flex: 1 1 auto; min-height: 0; }

      /* Canvas */
      #canvas-wrap { position: relative; flex: 1 1 auto; min-width: 0; overflow: auto; }
      #canvas {
        position: relative;
        min-width: 100%;
        min-height: 100%;
        height: 1200px;
        background-color: #0a0f1e;
        background-image: radial-gradient(circle, #1c2742 1px, transparent 1px);
        background-size: 22px 22px;
      }
      svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      svg.edges .edge-line { stroke: var(--edge); stroke-width: 2; fill: none; }
      svg.edges .edge-hit { stroke: transparent; stroke-width: 16; fill: none; pointer-events: stroke; cursor: pointer; }
      svg.edges .edge-x { fill: var(--danger); cursor: pointer; pointer-events: all; }
      svg.edges .edge-x-ring { fill: #1b1030; stroke: var(--danger); stroke-width: 1.5; cursor: pointer; pointer-events: all; }

      .node {
        position: absolute;
        width: 230px;
        background: var(--node);
        border: 1px solid var(--node-border);
        border-radius: 12px;
        padding: 10px 12px 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        user-select: none;
      }
      .node.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(124,92,255,0.4), 0 10px 30px rgba(0,0,0,0.45); }
      .node .node-head { display: flex; align-items: center; justify-content: space-between; cursor: grab; }
      .node .node-type { font-weight: 700; letter-spacing: 0.04em; font-size: 11px; }
      .node.start .node-type { color: var(--start); }
      .node.step .node-type { color: var(--step); }
      .node.end .node-type { color: var(--end); }
      .node .label { color: var(--text); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 8px 0 2px; }
      .node .name { font-size: 14px; font-weight: 600; }
      .node .slug { font-size: 12px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
      .node .tools { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
      .node .tool-chip { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
      .node .tool-chip .pill { font-size: 9px; padding: 1px 6px; border-radius: 999px; background: #26224a; color: #c3b7ff; }
      .node .dot {
        position: absolute; right: -8px; top: 50%; transform: translateY(-50%);
        width: 14px; height: 14px; border-radius: 50%; background: var(--accent-2);
        border: 2px solid #0a0f1e; cursor: crosshair;
      }
      .node .dot.in { left: -8px; right: auto; background: var(--muted); cursor: default; }
      .node .inactive-badge { font-size: 9px; color: #0a0f1e; background: var(--muted); padding: 1px 6px; border-radius: 999px; }

      /* Right inspector */
      #inspector {
        width: 320px;
        flex: 0 0 320px;
        background: var(--panel);
        border-left: 1px solid var(--node-border);
        padding: 14px;
        overflow: auto;
      }
      #inspector h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 8px; }
      #inspector .field { margin-bottom: 12px; }
      #inspector label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
      #inspector input[type="text"], #inspector select {
        width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--node-border);
        background: var(--panel-2); color: var(--text); font-size: 13px;
      }
      #inspector .tool-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
      #inspector .tool-row .pill { font-size: 9px; padding: 1px 6px; border-radius: 999px; background: #26224a; color: #c3b7ff; }
      #inspector .row-actions { display: flex; gap: 8px; margin-top: 14px; }
      #inspector .muted { color: var(--muted); }
      #inspector .note { font-size: 11px; color: var(--muted); margin: 8px 0; line-height: 1.5; }
      #inspector .slug-mono { font-family: ui-monospace, Menlo, monospace; }

      #status {
        position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px;
        max-width: 70%; padding: 9px 14px; border-radius: 10px; font-size: 12px;
        background: #171f36; border: 1px solid var(--node-border); display: none; z-index: 50;
      }
      #status.err { background: #2a1420; border-color: var(--danger); color: #ffd4d9; display: block; }
      #status.ok { background: #11271c; border-color: var(--ok); color: #c9ffe3; display: block; }
      code { font-family: ui-monospace, Menlo, monospace; background: #0a0f1e; padding: 1px 5px; border-radius: 5px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <div class="title">
          <span class="flow-kicker">LangGraph flow</span>
          <span id="graph-name" class="flow-name">Graph Workflow</span>
          <span id="active-chip" class="flow-chip">inactive</span>
          <small id="company-label"></small>
        </div>
        <button class="btn" id="btn-manage-tools" title="Seed/list the built-in tools">Manage Tools</button>
        <button class="btn" id="btn-load">Load</button>
        <button class="btn" id="btn-new-node">+ New Node</button>
        <button class="btn ok" id="btn-activate">Activate graph</button>
      </div>
      <div id="hint">
        Nothing is connected by default. Drag from a node's right-side dot onto another node to wire an edge.
        Click any edge's × marker to remove it. Click a node to edit it.
      </div>
      <div id="body">
        <div id="canvas-wrap">
          <div id="canvas">
            <svg class="edges"></svg>
          </div>
        </div>
        <div id="inspector">
          <h3>Selected node</h3>
          <div id="inspector-body"><p class="muted">Click a node to edit it.</p></div>
        </div>
      </div>
    </div>
    <div id="status"></div>

    <script>
      "use strict";
      // ---- querystring context (csrf + active company, handed in by the Django page) ----
      const params = new URLSearchParams(location.search);
      const CSRF = params.get("csrf") || "";
      const COMPANY_ID = params.get("company") || "";
      const COMPANY_NAME = params.get("company_name") || "";
      const API = "/api/v1/agents/";

      const TOOL_LABELS = {
        general_assistant: "General Assistant",
        document_search: "Document Search",
        chat_summarise: "Chat Summary",
        web_search: "Web Search",
      };
      const TOOL_PILL = {
        document_search: "rag",
        general_assistant: "prompt_only",
        chat_summarise: "summarise",
        web_search: "web",
      };

      // ---- state ----
      const state = {
        graph: null, // {id, name, is_active}
        nodes: [],   // AgentNode rows (+ position)
        edges: [],   // AgentEdge rows
        tools: [],   // Tool rows for the company
        selectedNodeId: null,
        linkFrom: null, // node id while dragging a new edge
      };

      // ---- dom refs ----
      const canvas = document.getElementById("canvas");
      const edgesSvg = canvas.querySelector("svg.edges");
      const inspectorBody = document.getElementById("inspector-body");
      const statusEl = document.getElementById("status");
      const companyLabel = document.getElementById("company-label");
      const graphNameEl = document.getElementById("graph-name");
      const activeChip = document.getElementById("active-chip");

      companyLabel.textContent = COMPANY_NAME ? "· " + COMPANY_NAME : "";

      // Reflect the loaded flow's name + active state in the toolbar header so
      // it is always obvious which LangGraph flow this canvas is editing.
      function updateFlowHeader() {
        const g = state.graph || {};
        graphNameEl.textContent = g.name || "Graph Workflow";
        const active = !!g.is_active;
        activeChip.textContent = active ? "active" : "inactive";
        activeChip.className = "flow-chip" + (active ? " active" : "");
      }

      // ---- helpers ----
      function showStatus(msg, kind) {
        statusEl.textContent = msg;
        statusEl.className = kind || "";
        if (kind) {
          clearTimeout(statusEl._t);
          statusEl._t = setTimeout(() => { statusEl.className = ""; statusEl.style.display = "none"; }, 6000);
        }
      }
      function clearStatus() { statusEl.className = ""; statusEl.style.display = "none"; }

      async function api(method, path, body) {
        const opts = { method, headers: { "X-CSRFToken": CSRF }, credentials: "same-origin" };
        if (body !== undefined) {
          opts.headers["Content-Type"] = "application/json";
          opts.body = JSON.stringify(body);
        }
        const res = await fetch(API + path, opts);
        let data = null;
        const text = await res.text();
        if (text) { try { data = JSON.parse(text); } catch (_) { data = text; } }
        if (!res.ok) {
          const detail = typeof data === "object" ? JSON.stringify(data) : (data || res.statusText);
          const err = new Error(method + " " + path + " failed (" + res.status + "): " + detail);
          err.status = res.status;
          err.data = data;
          throw err;
        }
        return data;
      }

      // company is required on create for a multi-company user; always send it.
      function withCompany(payload) {
        const out = Object.assign({}, payload);
        if (COMPANY_ID) out.company = COMPANY_ID;
        return out;
      }

      // Node box + layout geometry. COL_GAP must exceed NODE_W so adjacent
      // columns never overlap (the earlier layout put every STEP in the same
      // column, so multiple steps stacked on top of each other).
      const NODE_W = 230;
      const COL_GAP = 320;   // horizontal distance between columns (> NODE_W)
      const ROW_GAP = 240;   // vertical distance when two nodes share a column
      const ORIGIN_X = 60;
      const ORIGIN_Y = 80;

      // Deterministic left-to-right ordering for nodes WITHOUT a saved position:
      // START first, END last, STEP nodes in between (by creation order). Each
      // node gets its OWN column so none overlap. Computed once per render.
      function computeAutoColumns() {
        const starts = state.nodes.filter((n) => n.kind === "start");
        const steps = state.nodes.filter((n) => n.kind === "step");
        const ends = state.nodes.filter((n) => n.kind === "end");
        const ordered = starts.concat(steps, ends);
        const colOf = {};
        ordered.forEach((n, i) => { colOf[n.id] = i; });
        return colOf;
      }

      let _autoCols = {};

      function nodePos(node, index) {
        const p = node.position || {};
        if (typeof p.x === "number" && typeof p.y === "number") return { x: p.x, y: p.y };
        // No saved position: place each node in its OWN column so they never
        // overlap. _autoCols is filled at the top of render().
        const col = _autoCols[node.id];
        const column = typeof col === "number" ? col : (index + 1);
        return { x: ORIGIN_X + column * COL_GAP, y: ORIGIN_Y };
      }

      // A free slot for a newly created node: one column to the right of the
      // current rightmost node (using resolved positions, saved or auto), so it
      // never spawns on top of an existing node.
      function nextFreePosition() {
        _autoCols = computeAutoColumns();
        let maxX = ORIGIN_X;
        state.nodes.forEach((n, i) => {
          const pos = nodePos(n, i);
          if (pos.x > maxX) maxX = pos.x;
        });
        return { x: maxX + COL_GAP, y: ORIGIN_Y };
      }

      // ---- rendering ----
      function render() {
        // remove existing node elements (keep the svg)
        canvas.querySelectorAll(".node").forEach((el) => el.remove());

        // Assign each unsaved node its own column so nodes never overlap.
        _autoCols = computeAutoColumns();

        state.nodes.forEach((node, index) => {
          const pos = nodePos(node, index);
          node._pos = pos;
          const el = document.createElement("div");
          el.className = "node " + node.kind + (node.id === state.selectedNodeId ? " selected" : "");
          el.style.left = pos.x + "px";
          el.style.top = pos.y + "px";
          el.dataset.nodeId = node.id;

          const head = document.createElement("div");
          head.className = "node-head";
          const type = document.createElement("span");
          type.className = "node-type";
          type.textContent = node.kind.toUpperCase();
          head.appendChild(type);
          if (node.kind === "step" && node.is_active === false) {
            const b = document.createElement("span");
            b.className = "inactive-badge";
            b.textContent = "inactive";
            head.appendChild(b);
          }
          el.appendChild(head);

          const nameLabel = document.createElement("div");
          nameLabel.className = "label";
          nameLabel.textContent = "Name";
          el.appendChild(nameLabel);
          const name = document.createElement("div");
          name.className = "name";
          name.textContent = node.label || node.slug;
          el.appendChild(name);

          if (node.kind === "step") {
            const slugLabel = document.createElement("div");
            slugLabel.className = "label";
            slugLabel.textContent = "Slug";
            el.appendChild(slugLabel);
            const slug = document.createElement("div");
            slug.className = "slug";
            slug.textContent = node.slug;
            el.appendChild(slug);

            const toolsLabel = document.createElement("div");
            toolsLabel.className = "label";
            toolsLabel.textContent = "Tools this node can call";
            el.appendChild(toolsLabel);
            const toolsWrap = document.createElement("div");
            toolsWrap.className = "tools";
            const nodeToolIds = new Set(node.tools || []);
            if (nodeToolIds.size === 0) {
              const none = document.createElement("div");
              none.className = "tool-chip";
              none.textContent = "No tools attached";
              toolsWrap.appendChild(none);
            } else {
              state.tools.forEach((t) => {
                if (!nodeToolIds.has(t.id)) return;
                const chip = document.createElement("div");
                chip.className = "tool-chip";
                const tick = document.createElement("span");
                tick.textContent = "✓";
                chip.appendChild(tick);
                const lab = document.createElement("span");
                lab.textContent = TOOL_LABELS[t.slug] || t.name || t.slug;
                chip.appendChild(lab);
                const pill = document.createElement("span");
                pill.className = "pill";
                pill.textContent = TOOL_PILL[t.slug] || (t.config && t.config.kind === "prompt_only" ? "prompt_only" : "tool");
                chip.appendChild(pill);
                toolsWrap.appendChild(chip);
              });
            }
            el.appendChild(toolsWrap);
          }

          // ports: in (left) and out (right)
          const dotOut = document.createElement("div");
          dotOut.className = "dot out";
          dotOut.title = "Drag to another node to wire an edge";
          dotOut.addEventListener("mousedown", (ev) => { ev.preventDefault(); ev.stopPropagation(); startLink(node.id, ev); });
          el.appendChild(dotOut);
          const dotIn = document.createElement("div");
          dotIn.className = "dot in";
          el.appendChild(dotIn);

          head.addEventListener("mousedown", (ev) => startDrag(ev, node, el));
          el.addEventListener("click", (ev) => { ev.stopPropagation(); selectNode(node.id); });

          canvas.appendChild(el);
        });

        renderEdges();
        resizeCanvas();
      }

      function portPoints(node) {
        const p = node._pos || nodePos(node, 0);
        const w = NODE_W, h = 150;
        return {
          out: { x: p.x + w, y: p.y + 40 },
          in: { x: p.x, y: p.y + 40 },
          center: { x: p.x + w / 2, y: p.y + h / 2 },
        };
      }

      function renderEdges() {
        while (edgesSvg.firstChild) edgesSvg.removeChild(edgesSvg.firstChild);
        const byId = {};
        state.nodes.forEach((n) => (byId[n.id] = n));
        state.edges.forEach((edge) => {
          const s = byId[edge.source];
          const t = byId[edge.target];
          if (!s || !t) return;
          const a = portPoints(s).out;
          const b = portPoints(t).in;
          const midx = (a.x + b.x) / 2;
          const d = "M " + a.x + " " + a.y + " C " + midx + " " + a.y + " " + midx + " " + b.y + " " + b.x + " " + b.y;

          const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
          line.setAttribute("class", "edge-line");
          line.setAttribute("d", d);
          edgesSvg.appendChild(line);

          const hit = document.createElementNS("http://www.w3.org/2000/svg", "path");
          hit.setAttribute("class", "edge-hit");
          hit.setAttribute("d", d);
          hit.addEventListener("click", () => removeEdge(edge));
          edgesSvg.appendChild(hit);

          // × marker at the midpoint
          const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
          const ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          ring.setAttribute("class", "edge-x-ring");
          ring.setAttribute("cx", mx); ring.setAttribute("cy", my); ring.setAttribute("r", 9);
          ring.addEventListener("click", () => removeEdge(edge));
          edgesSvg.appendChild(ring);
          const x = document.createElementNS("http://www.w3.org/2000/svg", "text");
          x.setAttribute("class", "edge-x");
          x.setAttribute("x", mx); x.setAttribute("y", my + 3.5);
          x.setAttribute("text-anchor", "middle");
          x.setAttribute("font-size", "11");
          x.textContent = "×";
          x.addEventListener("click", () => removeEdge(edge));
          edgesSvg.appendChild(x);
        });
      }

      function resizeCanvas() {
        let maxX = 600, maxY = 500;
        state.nodes.forEach((n) => {
          const p = n._pos || nodePos(n, 0);
          maxX = Math.max(maxX, p.x + 300);
          maxY = Math.max(maxY, p.y + 260);
        });
        canvas.style.width = maxX + "px";
        canvas.style.height = maxY + "px";
      }

      // ---- node dragging ----
      function startDrag(ev, node, el) {
        ev.preventDefault();
        const startX = ev.clientX, startY = ev.clientY;
        const orig = node._pos || nodePos(node, 0);
        el.style.cursor = "grabbing";
        function move(e) {
          node._pos = { x: Math.max(0, orig.x + (e.clientX - startX)), y: Math.max(0, orig.y + (e.clientY - startY)) };
          el.style.left = node._pos.x + "px";
          el.style.top = node._pos.y + "px";
          renderEdges();
        }
        function up() {
          document.removeEventListener("mousemove", move);
          document.removeEventListener("mouseup", up);
          el.style.cursor = "grab";
          // persist the new position (best-effort)
          node.position = node._pos;
          api("PATCH", "node/" + node.id + "/", { position: node._pos }).catch(() => {});
        }
        document.addEventListener("mousemove", move);
        document.addEventListener("mouseup", up);
      }

      // ---- edge linking ----
      // Drag from a node's right-side output dot onto another node to wire an
      // edge. We resolve the TARGET from the element under the pointer on mouse
      // release (document.elementFromPoint) rather than relying on which
      // element's mouseup fires first — the earlier approach had a race with a
      // global mouseup reset that cleared the source before the target handler
      // ran, so edges never got created. A live preview line follows the cursor.
      let previewPath = null;

      function startLink(nodeId, ev) {
        state.linkFrom = nodeId;
        const sourceNode = state.nodes.find((n) => n.id === nodeId);
        const a = sourceNode ? portPoints(sourceNode).out : null;

        previewPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
        previewPath.setAttribute("class", "edge-line");
        previewPath.setAttribute("stroke-dasharray", "5 4");
        edgesSvg.appendChild(previewPath);

        const canvasRect = canvas.getBoundingClientRect();

        function move(e) {
          if (!a) return;
          const bx = e.clientX - canvasRect.left;
          const by = e.clientY - canvasRect.top;
          const midx = (a.x + bx) / 2;
          previewPath.setAttribute(
            "d",
            "M " + a.x + " " + a.y + " C " + midx + " " + a.y + " " + midx + " " + by + " " + bx + " " + by
          );
        }

        function up(e) {
          document.removeEventListener("mousemove", move);
          document.removeEventListener("mouseup", up);
          if (previewPath && previewPath.parentNode) previewPath.parentNode.removeChild(previewPath);
          previewPath = null;

          // Find the node under the cursor on release.
          const targetEl = document.elementFromPoint(e.clientX, e.clientY);
          const nodeEl = targetEl ? targetEl.closest(".node") : null;
          const targetId = nodeEl ? nodeEl.dataset.nodeId : null;
          const from = state.linkFrom;
          state.linkFrom = null;
          if (targetId && from && targetId !== from) {
            createEdge(from, targetId);
          }
        }

        document.addEventListener("mousemove", move);
        document.addEventListener("mouseup", up);
      }

      async function createEdge(sourceId, targetId) {
        if (!state.graph) return;
        try {
          const edge = await api("POST", "edge/", withCompany({
            graph: state.graph.id, source: sourceId, target: targetId,
          }));
          state.edges.push(edge);
          renderEdges();
          showStatus("Edge created.", "ok");
        } catch (e) { showStatus(e.message, "err"); }
      }

      async function removeEdge(edge) {
        try {
          await api("DELETE", "edge/" + edge.id + "/");
          state.edges = state.edges.filter((x) => x.id !== edge.id);
          renderEdges();
          showStatus("Edge removed.", "ok");
        } catch (e) { showStatus(e.message, "err"); }
      }

      // ---- selection / inspector ----
      function selectNode(nodeId) {
        state.selectedNodeId = nodeId;
        render();
        renderInspector();
      }
      canvas.addEventListener("click", () => { state.selectedNodeId = null; render(); renderInspector(); });

      function renderInspector() {
        inspectorBody.innerHTML = "";
        const node = state.nodes.find((n) => n.id === state.selectedNodeId);
        if (!node) {
          const p = document.createElement("p");
          p.className = "muted";
          p.textContent = "Click a node to edit it.";
          inspectorBody.appendChild(p);
          renderToolsSummary();
          return;
        }

        const mkField = (labelText, inputEl) => {
          const wrap = document.createElement("div");
          wrap.className = "field";
          const lab = document.createElement("label");
          lab.textContent = labelText;
          wrap.appendChild(lab);
          wrap.appendChild(inputEl);
          return wrap;
        };

        // Type (editable select) so a node's kind can be fixed/changed. START
        // and END are structural; STEP carries tools and runs the router.
        const typeSelect = document.createElement("select");
        [["start", "START"], ["step", "STEP"], ["end", "END"]].forEach(function (pair) {
          const opt = document.createElement("option");
          opt.value = pair[0];
          opt.textContent = pair[1];
          if (node.kind === pair[0]) opt.selected = true;
          typeSelect.appendChild(opt);
        });
        inspectorBody.appendChild(mkField("Type", typeSelect));

        // Name
        const nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.value = node.label || "";
        inspectorBody.appendChild(mkField("Name", nameInput));

        let slugInput = null;
        const toolChecks = [];
        // Re-render the inspector when the type changes so STEP reveals the
        // slug + tool checkboxes (and START/END hide them).
        typeSelect.addEventListener("change", function () {
          node._pendingKind = typeSelect.value;
          node.kind = typeSelect.value;
          renderInspector();
        });
        const effectiveKind = node._pendingKind || node.kind;
        if (effectiveKind === "step") {
          slugInput = document.createElement("input");
          slugInput.type = "text";
          slugInput.className = "slug-mono";
          slugInput.value = node.slug || "";
          inspectorBody.appendChild(mkField("Slug", slugInput));

          const toolsField = document.createElement("div");
          toolsField.className = "field";
          const lab = document.createElement("label");
          lab.textContent = "Tools this node can call";
          toolsField.appendChild(lab);
          const nodeToolIds = new Set(node.tools || []);
          if (state.tools.length === 0) {
            const note = document.createElement("div");
            note.className = "note";
            note.appendChild(document.createTextNode("No tools yet. Click "));
            const b = document.createElement("code"); b.textContent = "Manage Tools";
            note.appendChild(b);
            note.appendChild(document.createTextNode(" to seed the built-in tools."));
            toolsField.appendChild(note);
          }
          state.tools.forEach((t) => {
            const row = document.createElement("div");
            row.className = "tool-row";
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.checked = nodeToolIds.has(t.id);
            cb.dataset.toolId = t.id;
            toolChecks.push(cb);
            row.appendChild(cb);
            const name = document.createElement("span");
            name.textContent = TOOL_LABELS[t.slug] || t.name || t.slug;
            row.appendChild(name);
            const pill = document.createElement("span");
            pill.className = "pill";
            pill.textContent = TOOL_PILL[t.slug] || (t.config && t.config.kind === "prompt_only" ? "prompt_only" : "tool");
            row.appendChild(pill);
            toolsField.appendChild(row);
          });
          inspectorBody.appendChild(toolsField);

          const routerNote = document.createElement("div");
          routerNote.className = "note";
          routerNote.appendChild(document.createTextNode(
            "When this node has multiple tools the routing prompt (which one to call) is managed in Langfuse under the name "
          ));
          const code = document.createElement("code");
          code.textContent = node.slug || "chat_agent";
          routerNote.appendChild(code);
          routerNote.appendChild(document.createTextNode("."));
          inspectorBody.appendChild(routerNote);
        }

        // actions
        const actions = document.createElement("div");
        actions.className = "row-actions";
        const save = document.createElement("button");
        save.className = "btn ok";
        save.textContent = "Save";
        save.addEventListener("click", () => saveNode(node, typeSelect, nameInput, slugInput, toolChecks));
        const cancel = document.createElement("button");
        cancel.className = "btn";
        cancel.textContent = "Cancel";
        cancel.addEventListener("click", () => { state.selectedNodeId = null; render(); renderInspector(); });
        const del = document.createElement("button");
        del.className = "btn danger";
        del.textContent = "Delete";
        del.addEventListener("click", () => deleteNode(node));
        actions.appendChild(save);
        actions.appendChild(cancel);
        actions.appendChild(del);
        inspectorBody.appendChild(actions);
      }

      function renderToolsSummary() {
        const h = document.createElement("h3");
        h.textContent = "Tools";
        inspectorBody.appendChild(h);
        if (state.tools.length === 0) {
          const note = document.createElement("div");
          note.className = "note";
          note.appendChild(document.createTextNode("No tools yet. Click "));
          const b = document.createElement("code"); b.textContent = "Manage Tools";
          note.appendChild(b);
          note.appendChild(document.createTextNode(" to create the built-in tools."));
          inspectorBody.appendChild(note);
          return;
        }
        state.tools.forEach((t) => {
          const row = document.createElement("div");
          row.className = "tool-row";
          const name = document.createElement("span");
          name.textContent = (TOOL_LABELS[t.slug] || t.name || t.slug) + (t.is_enabled ? "" : " (disabled)");
          row.appendChild(name);
          const pill = document.createElement("span");
          pill.className = "pill";
          // prompt-only tools created from Langfuse carry a kind=prompt_only
          // config but no built-in TOOL_PILL entry.
          pill.textContent = TOOL_PILL[t.slug] || (t.config && t.config.kind === "prompt_only" ? "prompt_only" : "tool");
          row.appendChild(pill);
          // Editable Langfuse prompt-name pointer, saved on change.
          const promptInput = document.createElement("input");
          promptInput.type = "text";
          promptInput.placeholder = "langfuse prompt name";
          promptInput.value = t.prompt_name || "";
          promptInput.title = "Langfuse prompt name";
          promptInput.style.marginLeft = "8px";
          promptInput.addEventListener("change", async () => {
            try {
              const updated = await api("PATCH", "tool/" + t.id + "/", { prompt_name: promptInput.value.trim() });
              Object.assign(t, updated);
              showStatus("Prompt name saved.", "ok");
            } catch (e) { showStatus(e.message, "err"); }
          });
          row.appendChild(promptInput);
          inspectorBody.appendChild(row);
        });

        // Inline hint explaining where the prompt text actually lives.
        const hint = document.createElement("div");
        hint.className = "note";
        hint.appendChild(document.createTextNode(
          "Prompt TEXT is edited in Langfuse under this name; prompt-only tools answer via the general assistant using that prompt."
        ));
        inspectorBody.appendChild(hint);

        // "Add Langfuse tool" affordance: creates a prompt-only tool from a
        // Langfuse prompt name.
        const addRow = document.createElement("div");
        addRow.className = "tool-row";
        const addInput = document.createElement("input");
        addInput.type = "text";
        addInput.placeholder = "Langfuse prompt name";
        addRow.appendChild(addInput);
        const addBtn = document.createElement("button");
        addBtn.className = "btn";
        addBtn.textContent = "Add Langfuse tool";
        addBtn.style.marginLeft = "8px";
        addBtn.addEventListener("click", async () => {
          const promptName = addInput.value.trim();
          if (!promptName) { showStatus("Enter a Langfuse prompt name.", "err"); return; }
          try {
            const tools = await api("POST", "tool/sync_langfuse/", { prompt_names: [promptName] });
            if (Array.isArray(tools)) {
              const byId = {};
              state.tools.forEach((x) => { byId[x.id] = x; });
              tools.forEach((x) => {
                if (byId[x.id]) { Object.assign(byId[x.id], x); }
                else { state.tools.push(x); }
              });
            }
            addInput.value = "";
            render();
            renderInspector();
            showStatus("Langfuse tool added.", "ok");
          } catch (e) { showStatus(e.message, "err"); }
        });
        addRow.appendChild(addBtn);
        inspectorBody.appendChild(addRow);
      }

      async function saveNode(node, typeSelect, nameInput, slugInput, toolChecks) {
        const kind = typeSelect ? typeSelect.value : node.kind;
        const payload = { kind: kind, label: nameInput.value.trim() };
        if (slugInput) payload.slug = slugInput.value.trim();
        // Tools apply only to STEP nodes; send the checked ids. For non-step
        // nodes clear tools so a type change away from step doesn't keep stale
        // tool links.
        if (kind === "step") {
          payload.tools = toolChecks.filter((cb) => cb.checked).map((cb) => cb.dataset.toolId);
        } else {
          payload.tools = [];
        }
        try {
          const updated = await api("PATCH", "node/" + node.id + "/", payload);
          delete node._pendingKind;
          Object.assign(node, updated);
          render();
          renderInspector();
          showStatus("Node saved.", "ok");
        } catch (e) { showStatus(e.message, "err"); }
      }

      async function deleteNode(node) {
        try {
          await api("DELETE", "node/" + node.id + "/");
          state.nodes = state.nodes.filter((n) => n.id !== node.id);
          state.edges = state.edges.filter((e) => e.source !== node.id && e.target !== node.id);
          state.selectedNodeId = null;
          render();
          renderInspector();
          showStatus("Node deleted.", "ok");
        } catch (e) { showStatus(e.message, "err"); }
      }

      // ---- toolbar actions ----
      async function ensureGraph() {
        if (state.graph) return state.graph;
        // Try to load an existing graph for this company first.
        const list = await api("GET", "graph/");
        const rows = Array.isArray(list) ? list : (list.results || []);
        if (rows.length) {
          state.graph = rows[0];
        } else {
          state.graph = await api("POST", "graph/", withCompany({ name: "Graph Workflow" }));
          showStatus("Created a new graph.", "ok");
        }
        return state.graph;
      }

      async function loadGraph() {
        clearStatus();
        try {
          await ensureGraph();
          const payload = await api("GET", "graph/" + state.graph.id + "/load/");
          state.graph = payload.graph;
          state.nodes = payload.nodes || [];
          state.edges = payload.edges || [];
          state.tools = payload.tools || [];
          updateFlowHeader();
          state.selectedNodeId = null;
          render();
          renderInspector();
          if (state.nodes.length === 0) {
            showStatus("Graph is empty. Use + New Node, or click Manage Tools then re-load.", "ok");
          }
        } catch (e) {
          showStatus(e.message, "err");
        }
      }

      async function newNode() {
        clearStatus();
        try {
          await ensureGraph();
          // + New Node always adds a STEP node — the only kind that carries
          // tools and that the router runs. START/END are structural endpoints
          // (one each per graph) and are created by seeding; new nodes you add
          // are steps you wire BETWEEN them. (The earlier count-based kind guess
          // produced duplicate start/end nodes and no editable step, which is
          // why tools couldn't be chosen.) Pick a unique step slug.
          const existing = new Set(state.nodes.map((n) => n.slug));
          let slug = existing.has("chat_agent") ? null : "chat_agent";
          if (!slug) {
            let i = 2;
            while (existing.has("step_" + i)) i++;
            slug = "step_" + i;
          }
          const node = await api("POST", "node/", {
            // company is derived server-side from the graph — never sent here.
            graph: state.graph.id,
            kind: "step",
            slug: slug,
            label: "New step",
            // Spawn to the RIGHT of the rightmost existing node so a new node
            // never lands on top of another.
            position: nextFreePosition(),
          });
          state.nodes.push(node);
          render();
          selectNode(node.id);
          showStatus("Step node added. Pick its tools, then Save.", "ok");
        } catch (e) { showStatus(e.message, "err"); }
      }

      async function manageTools() {
        clearStatus();
        // The canvas cannot run manage.py; it creates the built-in Tool rows via
        // the API instead (idempotent — a slug that already exists is skipped).
        const builtins = [
          { slug: "general_assistant", name: "General assistant" },
          { slug: "document_search", name: "Document search" },
          { slug: "chat_summarise", name: "Chat summary" },
          { slug: "web_search", name: "Web search" },
        ];
        const have = new Set(state.tools.map((t) => t.slug));
        let created = 0;
        for (const spec of builtins) {
          if (have.has(spec.slug)) continue;
          try {
            const tool = await api("POST", "tool/", withCompany({ slug: spec.slug, name: spec.name, is_enabled: true }));
            state.tools.push(tool);
            created++;
          } catch (e) {
            showStatus(e.message, "err");
            return;
          }
        }
        render();
        renderInspector();
        showStatus(created ? ("Created " + created + " built-in tool(s).") : "All built-in tools already exist.", "ok");
      }

      async function activateGraph() {
        clearStatus();
        try {
          await ensureGraph();
          await api("POST", "graph/" + state.graph.id + "/activate/");
          state.graph.is_active = true;
          updateFlowHeader();
          showStatus("Graph activated — new chat messages now route through it.", "ok");
        } catch (e) { showStatus(e.message, "err"); }
      }

      document.getElementById("btn-load").addEventListener("click", loadGraph);
      document.getElementById("btn-new-node").addEventListener("click", newNode);
      document.getElementById("btn-manage-tools").addEventListener("click", manageTools);
      document.getElementById("btn-activate").addEventListener("click", activateGraph);

      // ---- boot ----
      if (!COMPANY_ID) {
        showStatus("No active company. Pick a company in the top-right switcher, then reload this page.", "err");
      } else {
        loadGraph();
      }
    </script>
  </body>
</html>
