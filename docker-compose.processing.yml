
name: agentic-flow-processing

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    ports:
      - "9093:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - kafka-data:/var/lib/kafka/data

  temporal-postgresql:
    image: postgres:16.3
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.24.2
    restart: unless-stopped
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    # gRPC on loopback only: workers and Django run on this host.
    ports:
      - "127.0.0.1:7234:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql

  temporal-ui:
    # 2.26.x shows a blank page under TEMPORAL_UI_PUBLIC_PATH: its CSP hash
    # no longer matches the inline boot script, so the browser blocks it.
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    depends_on:
      - temporal
    # Not published on the host at all: only temporal-ui-gate can reach it.
    # Browsers go through Django's staff-only proxy at
    # http://localhost:8000/temporal/.
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_UI_PUBLIC_PATH: /temporal
      # View only for every admin: no cancel, terminate, reset or signal.
      TEMPORAL_DISABLE_WRITE_ACTIONS: "true"
      TEMPORAL_CORS_ORIGINS: http://localhost:8000

  temporal-ui-gate:
    # Loopback only. Returns 403 unless the request carries the secret that
    # only Django's proxy sends, so opening :8081 directly does not work.
    # Used by chat workflow links (http://localhost:8000/temporal/).
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - temporal-ui
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      TEMPORAL_UI_PROXY_SECRET: ${TEMPORAL_UI_PROXY_SECRET:?set TEMPORAL_UI_PROXY_SECRET in .env}
    volumes:
      - ./infrastructure/temporal/ui_gate.conf.template:/etc/nginx/templates/default.conf.template:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    # Listens on 8180 inside Docker too, so http://keycloak:8180 is the same
    # address for the browser (via "127.0.0.1 keycloak" in /etc/hosts) and for
    # temporal-ui-sso. Admin console: http://keycloak:8180.
    ports:
      - "127.0.0.1:8180:8180"
    environment:
      KC_HTTP_PORT: 8180
      KC_HOSTNAME: http://keycloak:8180
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      TEMPORAL_UI_CLIENT_SECRET: ${TEMPORAL_UI_CLIENT_SECRET:?set TEMPORAL_UI_CLIENT_SECRET in .env}
    volumes:
      - ./infrastructure/keycloak/realm-agentic-flow.json:/opt/keycloak/data/import/realm-agentic-flow.json:ro
      - keycloak-data:/opt/keycloak/data

  temporal-ui-sso:
    # Opened directly by the browser; Temporal UI's own OIDC login (Keycloak).
    # Used by documents admin workflow links. Chat keeps the proxy + gate.
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    depends_on:
      - temporal
      - keycloak
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_AUTH_ENABLED: "true"
      TEMPORAL_AUTH_PROVIDER_URL: http://keycloak:8180/realms/agentic-flow
      TEMPORAL_AUTH_CLIENT_ID: temporal-ui
      TEMPORAL_AUTH_CLIENT_SECRET: ${TEMPORAL_UI_CLIENT_SECRET:?set TEMPORAL_UI_CLIENT_SECRET in .env}
      TEMPORAL_AUTH_CALLBACK_URL: http://localhost:8080/auth/sso/callback
      TEMPORAL_AUTH_SCOPES: openid,profile,email
      TEMPORAL_DISABLE_WRITE_ACTIONS: "true"

volumes:
  kafka-data:
  temporal-pg-data:
  keycloak-data:
